sawit_seed:
  itemname: "<gradient:#65d649:#2ea329><bold>Bibit Sawit Tenera</bold></gradient>"
  material: PAPER
  lore:
    - "<dark_gray>Bibit Perkebunan Unggul"
    - ""
    - "<gray>Tanam di atas <green>Tanah / Rumput</green> untuk"
    - "<gray>menumbuhkan pohon kelapa sawit produktif."
    - ""
    - "<yellow>Syarat Tanam: <white>Lisensi 20.000 Kayu Oak"
    - "<gold>Klik Kanan Tanah <dark_gray>- <green>Menanam Bibit"
  Pack:
    parent_model: "item/generated"
    texture: "nusasawit:item/sawit_seed"

sawit_stage_1:
  itemname: "<green>Tunas Kelapa Sawit (Tahap 1)"
  material: PAPER
  Pack:
    model: "nusasawit:block/sawit_stage_1"
  Mechanics:
    furniture:
      rotatable: false
      restricted_rotation: VERY_STRICT
      limited_placing:
        roof: false
        floor: true
        wall: false
      hitbox:
        barriers:
          - 0,0,0
      properties:
        display_transform: NONE
        scale: 1.1,1.1,1.1
        translation: 0,0.05,0
        view_range: 2.0
      drop:
        silktouch: false
        loots: []
      block_sounds:
        place_sound: block.grass.place
        break_sound: block.grass.break
        hit_sound: block.grass.hit

