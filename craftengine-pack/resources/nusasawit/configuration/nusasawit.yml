items:
  nusasawit:sawit_seed:
    material: paper
    texture: nusasawit:item/sawit_seed
    data:
      item-name: "<!i><gradient:#65d649:#2ea329><bold>Bibit Sawit Tenera</bold></gradient>"
      lore:
        - "<!i><dark_gray>Bibit Perkebunan Unggul"
        - ""
        - "<!i><gray>Tanam di atas <green>Tanah / Rumput</green> untuk"
        - "<!i><gray>menumbuhkan pohon kelapa sawit produktif."
        - ""
        - "<!i><yellow>Syarat Tanam: <white>Lisensi 20.000 Kayu Oak"
        - "<!i><gold>Klik Kanan Tanah <dark_gray>- <green>Menanam Bibit"

  nusasawit:sawit_stage_1:
    material: paper
    model: nusasawit:block/sawit_stage_1
    data:
      item-name: "<!i><green>Tunas Kelapa Sawit (Tahap 1)"

  nusasawit:sawit_stage_2:
    material: paper
    model: nusasawit:block/sawit_stage_2
    data:
      item-name: "<!i><green>Pohon Sawit Muda (Tahap 2)"

  nusasawit:sawit_stage_3_growing:
    material: paper
    model: nusasawit:block/sawit_stage_3_growing
    data:
      item-name: "<!i><dark_green>Pohon Sawit Dewasa (Berbunga)"

  nusasawit:sawit_stage_3_ripe:
    material: paper
    model: nusasawit:block/sawit_stage_3_ripe
    data:
      item-name: "<!i><gold><bold>Pohon Sawit Siap Panen</bold></gold>"

  nusasawit:sawit_tbs:
    material: paper
    texture: nusasawit:item/sawit_tbs
    data:
      item-name: "<!i><gradient:#ff6a1a:#ffb326><bold>Tandan Buah Segar (TBS)</bold></gradient>"
      lore:
        - "<!i><dark_gray>Hasil Panen Kebun Sawit"
        - ""
        - "<!i><gray>Buah kelapa sawit matang segar yang"
        - "<!i><gray>siap dijual atau diolah menjadi CPO."
        - ""
        - "<!i><yellow>Jual di <gold>/sawit</gold>"

  nusasawit:sawit_tbs_super:
    material: paper
    texture: nusasawit:item/sawit_tbs_super
    data:
      item-name: "<!i><gradient:#ffd700:#fff280><bold>TBS Tenera Super</bold></gradient>"
      lore:
        - "<!i><dark_gray>Hasil Panen Kualitas Ekspor"
        - ""
        - "<!i><gray>Tandan buah sawit kualitas tertinggi"
        - "<!i><gray>dengan rendemen minyak berlipat ganda!"
        - ""
        - "<!i><yellow>Jual mahal di <gold>/sawit</gold>"

  nusasawit:sawit_cpo:
    material: paper
    texture: nusasawit:item/sawit_cpo
    data:
      item-name: "<!i><gradient:#f59e0b:#fde047><bold>Minyak Sawit Mentah (CPO)</bold></gradient>"
      lore:
        - "<!i><dark_gray>Produk Olahan Kilang Sawit"
        - ""
        - "<!i><gray>Crude Palm Oil murni bernilai ekonomi"
        - "<!i><gray>tinggi hasil ekstraksi tandan segar."
        - ""
        - "<!i><yellow>Jual dengan harga premium di <gold>/sawit</gold>"

  nusasawit:pupuk_npk:
    material: paper
    texture: nusasawit:item/pupuk_npk
    data:
      item-name: "<!i><gradient:#84cc16:#22c55e><bold>Pupuk NPK Sawit</bold></gradient>"
      lore:
        - "<!i><dark_gray>Nutrisi Percepatan Kebun"
        - ""
        - "<!i><gray>Mempercepat pertumbuhan pohon sawit"
        - "<!i><gray>dan pematangan tandan buah secara instan."
        - ""
        - "<!i><gold>Klik Kanan Pohon Sawit <dark_gray>- <green>Beri Pupuk"

  nusasawit:egrek_sawit:
    material: iron_hoe
    texture: nusasawit:item/egrek_sawit
    data:
      item-name: "<!i><gradient:#cbd5e1:#f8fafc><bold>Egrek Panen Sawit</bold></gradient>"
      components:
        minecraft:max_stack_size: 1
      lore:
        - "<!i><dark_gray>Alat Panen Perkebunan (Tier I)"
        - ""
        - "<!i><gray>Sabit galah tajam khusus memanen"
        - "<!i><gray>tandan sawit matang dengan efisien."
        - ""
        - "<!i><green>+1 Bonus TBS <gray>& <gold>15% Peluang TBS Super"
        - "<!i><gold>Klik Kanan Sawit Matang <dark_gray>- <green>Panen"

  nusasawit:egrek_master:
    material: golden_hoe
    texture: nusasawit:item/egrek_master
    data:
      item-name: "<!i><gradient:#f59e0b:#fef08a><bold>Egrek Baja Nusantara</bold></gradient>"
      components:
        minecraft:max_stack_size: 1
      lore:
        - "<!i><dark_gray>Alat Panen Master (Tier II)"
        - ""
        - "<!i><gray>Egrek baja tempa berlapis emas untuk"
        - "<!i><gray>hasil panen melimpah tanpa merusak pelepah."
        - ""
        - "<!i><green>+2 Bonus TBS <gray>& <gold>35% Peluang TBS Super"
        - "<!i><gold>Klik Kanan Sawit Matang <dark_gray>- <green>Panen"

  nusasawit:sawit_crate:
    material: paper
    model: nusasawit:block/sawit_crate
    behavior:
      type: furniture_item
      furniture: nusasawit:sawit_crate
    data:
      item-name: "<!i><gold><bold>Peti Gudang TBS</bold></gold>"
      lore:
        - "<!i><dark_gray>Blok Dekorasi Kebun Sawit"
        - ""
        - "<!i><gray>Peti kayu berisi tumpukan tandan buah"
        - "<!i><gray>sawit segar untuk menghias gudangmu."

