name: NusaSawit
version: "${version}"
main: id.nusaspigot.sawit.NusaSawitPlugin
api-version: "1.21"
authors:
  - NusaSpigot
description: Oil Palm Plantation plugin with natural wood license quest, Vault economy, and Nexo / ItemsAdder / CraftEngine 3D custom models.
softdepend:
  - Nexo
  - ItemsAdder
  - CraftEngine
  - Vault
commands:
  sawit:
    description: Menu utama perkebunan kelapa sawit NusaSawit
    aliases: [nusasawit, kebunsawit]
    usage: /sawit [sell|progress|claim|admin]
permissions:
  nusasawit.use:
    description: Mengakses fitur dasar perkebunan NusaSawit
    default: true
  nusasawit.admin:
    description: Akses penuh perintah admin dan bypass proteksi kebun sawit
    default: op
